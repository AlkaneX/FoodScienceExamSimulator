<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Science Exam Simulator</title>
<meta name="description" content="Practice key terms, true/false, multiple choice, fill-in-the-blank, scenario and short-answer questions for the food science exam. Works on phones and computers.">
<script>try{var t=localStorage.getItem('fses-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   Design tokens. The look borrows from the Nutrition Facts panel:
   heavy black rules, condensed bold type, highlighter yellow.
------------------------------------------------------------------ */
:root{
  --bench:#E3E9E5;      /* page background: lab bench */
  --label:#FFFFFF;      /* panels and cards */
  --ink:#121413;        /* text and rules */
  --muted:#58615B;
  --hair:#C8D0CB;
  --hl:#FFE14A;         /* highlighter */
  --hl-ink:#121413;
  --ok:#17784A; --ok-bg:#E1F2E8;
  --no:#BF3328; --no-bg:#FBE6E3;
  --part:#9A6400;
  --focus:#2C5BE8;
  --shadow:0 1px 0 rgba(0,0,0,.04), 0 10px 28px -16px rgba(18,20,19,.35);
  --f-display:"Archivo","Helvetica Neue","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bench:#0E1110; --label:#181C1A; --ink:#ECF1ED; --muted:#A0AAA4; --hair:#2E3632;
    --hl:#F3D23C; --hl-ink:#121413; --ok:#55CB91; --ok-bg:#10281C; --no:#F27D71; --no-bg:#2E1613;
    --part:#E8B44C; --focus:#86A6FF; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bench:#0E1110; --label:#181C1A; --ink:#ECF1ED; --muted:#A0AAA4; --hair:#2E3632;
  --hl:#F3D23C; --hl-ink:#121413; --ok:#55CB91; --ok-bg:#10281C; --no:#F27D71; --no-bg:#2E1613;
  --part:#E8B44C; --focus:#86A6FF; --shadow:none; color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bench);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
p{margin:0 0 .7em}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--ink);color:var(--label);padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.topbar-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;position:relative}
.brand{background:none;border:0;padding:2px 0;color:inherit;text-align:left;font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:1.3rem;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.brand small{display:block;font-weight:700;font-stretch:100%;font-size:.62rem;letter-spacing:.16em;opacity:.72;margin-top:3px}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.timer{display:flex;align-items:stretch;border:2px solid currentColor;border-radius:999px;overflow:hidden;transition:background-color .2s,color .2s}
.timer button{background:none;border:0;color:inherit;display:flex;align-items:center;gap:6px;min-height:36px;padding:4px 10px}
.t-face{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem;letter-spacing:.02em}
.t-play{border-left:2px solid currentColor !important;padding:4px 9px !important}
.timer.running{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.timer.running .t-play{border-left-color:var(--hl-ink) !important}
.timer.expired{background:var(--no);color:#fff;border-color:var(--no)}
.icon-btn{width:38px;height:38px;border-radius:999px;border:2px solid currentColor;background:none;color:inherit;display:grid;place-items:center;padding:0}
svg{display:block;pointer-events:none}

.t-panel{position:absolute;right:0;top:calc(100% + 10px);width:min(330px,calc(100vw - 32px));background:var(--label);color:var(--ink);border:2px solid var(--ink);border-top-width:8px;padding:12px 14px 14px;box-shadow:var(--shadow);z-index:40}
.t-panel h2{font-family:var(--f-display);font-weight:900;font-stretch:75%;font-size:1.5rem;text-transform:uppercase;margin:0 0 8px;line-height:1}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:4px;overflow:hidden;margin-bottom:10px}
.seg button{border:0;background:var(--label);padding:8px;font-family:var(--f-display);font-weight:800;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--label)}
.t-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.t-row label{font-family:var(--f-display);font-weight:700}
.t-row input{width:90px;min-height:40px;border:2px solid var(--ink);border-radius:4px;padding:4px 8px;background:var(--label);font-size:1rem}
.t-big{font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums;margin:2px 0 10px}
.t-note{font-size:.85rem;color:var(--muted);margin:10px 0 0}

/* ---------- layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.wrap.wide{max-width:960px}
.intro{font-size:1rem;color:var(--muted);margin:0 0 16px;max-width:60ch}

/* ---------- Nutrition-Facts-style panel ---------- */
.nf{background:var(--label);border:2px solid var(--ink);padding:8px 14px 14px;box-shadow:var(--shadow)}
.nf-title{font-family:var(--f-display);font-weight:900;font-stretch:70%;font-size:clamp(2.5rem,10vw,3.4rem);line-height:.88;letter-spacing:-.01em;margin:2px 0 4px}
.nf-sub{margin:0 0 4px;font-size:1rem}
.nf-bar{border:0;border-top:12px solid var(--ink);margin:6px 0 4px}
.nf-bar.mid{border-top-width:6px}
.nf-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--ink);padding:5px 0;font-family:var(--f-display);font-size:1rem}
.nf-row:first-child{border-top:0}
.nf-row .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.nf-row.indent{padding-left:16px}
.nf-row b{font-weight:800}
.nf-serv{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;align-items:baseline}
.nf-big{display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--f-display);font-weight:900;font-stretch:75%;line-height:1}
.nf-big .k{font-size:1.9rem}
.nf-big .k small{display:block;font-size:.8rem;font-stretch:100%;font-weight:800;letter-spacing:.02em;margin-bottom:2px}
.nf-big .v{font-size:3rem;font-variant-numeric:tabular-nums}
.nf-foot{font-size:.82rem;line-height:1.4;margin:10px 0 0}
.nf-head{display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:800;font-size:.8rem;padding:2px 0}

.home-grid{display:grid;gap:20px;align-items:start}
@media (min-width:820px){.home-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.nf.pending{color:var(--muted);border-color:var(--muted);box-shadow:none;background:transparent}
.nf.pending .nf-bar{border-top-color:var(--muted)}
.nf.pending .nf-row{border-top-color:var(--muted)}
.pending-note{font-family:var(--f-display);font-weight:900;font-stretch:75%;font-size:1.9rem;color:var(--ink);margin:16px 0 14px;line-height:1}

.mode-btn{display:block;width:100%;text-align:left;background:var(--ink);color:var(--label);border:2px solid var(--ink);border-radius:4px;padding:12px 14px;margin-top:10px;transition:background-color .15s,color .15s}
.mode-btn .k{display:block;font-family:var(--f-display);font-weight:800;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.mode-btn .t{display:block;font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:1.55rem;line-height:1.1}
.mode-btn .d{display:block;font-size:.92rem;opacity:.85}
.mode-btn:hover,.mode-btn:focus-visible{background:var(--hl);color:var(--hl-ink)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border:2px solid var(--ink);border-radius:4px;background:var(--label);color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.02rem;letter-spacing:.01em;transition:background-color .15s,color .15s}
.btn.primary{background:var(--ink);color:var(--label)}
.btn:hover:not(:disabled){background:var(--hl);color:var(--hl-ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn-row .btn{flex:1 1 180px}
.linkbtn{background:none;border:0;padding:6px 0;font-family:var(--f-display);font-weight:700;font-size:.98rem;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.linkbtn:hover{background:var(--hl);color:var(--hl-ink)}

/* ---------- question types menu ---------- */
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.mode-chip{display:inline-block;background:var(--hl);color:var(--hl-ink);font-family:var(--f-display);font-weight:800;padding:1px 7px;border-radius:3px}
.filters{display:grid;gap:10px 16px;padding:8px 0 4px}
.filters>*{min-width:0}
@media (min-width:600px){.filters{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:4px;font-family:var(--f-display);font-weight:800;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase}
.field select{width:100%;max-width:100%;min-height:46px;border:2px solid var(--ink);border-radius:4px;background:var(--label);padding:6px 10px;font-family:var(--f-body);font-size:1rem;text-transform:none;letter-spacing:0;font-weight:400}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;line-height:1.35;cursor:pointer}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.type-row{display:grid;grid-template-columns:1fr auto 18px;align-items:center;gap:12px;width:calc(100% + 16px);margin:0 -8px;background:none;border:0;border-top:1px solid var(--ink);padding:11px 8px;text-align:left;color:inherit;transition:background-color .12s}
.type-row:first-of-type{border-top:0}
.type-row:hover:not(:disabled){background:var(--hl);color:var(--hl-ink)}
.type-row:hover:not(:disabled) small{color:inherit}
.type-row:disabled{opacity:.4;cursor:not-allowed}
.tr-name b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.14rem;line-height:1.2}
.tr-name small{display:block;font-size:.86rem;color:var(--muted);margin-top:2px}
.tr-n{font-family:var(--f-display);font-weight:800;font-size:1.14rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tr-n small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.type-row:hover:not(:disabled) .tr-n small{color:inherit}
.type-row.exam b{font-weight:900;font-stretch:80%;font-size:1.5rem}

/* ---------- quiz ---------- */
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prog{height:8px;background:var(--hair);margin:8px 0 8px;border-radius:2px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--ink);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-display);font-weight:800;font-size:.9rem;margin-bottom:10px;flex-wrap:wrap}
.qmeta .sc{background:var(--ink);color:var(--label);padding:0 8px;border-radius:3px}
.card{background:var(--label);border:2px solid var(--ink);border-top-width:10px;padding:16px 16px 18px;box-shadow:var(--shadow);outline:none}
@media (min-width:640px){.card{padding:22px 26px 26px}}
.eyebrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-family:var(--f-display);font-weight:700;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.tag{border:1.5px solid currentColor;border-radius:3px;padding:0 6px;letter-spacing:.06em}
.tag.g{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.q-prompt{font-family:var(--f-display);font-weight:800;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px}
.q-text{font-size:1.2rem;line-height:1.45;margin:0 0 16px}
@media (min-width:640px){.q-text{font-size:1.32rem}}
.kt-term{display:block;font-family:var(--f-display);font-weight:900;font-stretch:85%;font-size:1.45em;line-height:1.1;margin-bottom:6px}
.defq{margin:4px 0 16px;padding:12px 14px;border-left:8px solid var(--hl);background:color-mix(in srgb,var(--hl) 14%,var(--label));font-size:1.15rem;line-height:1.45}

.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--label);color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:12px 14px;min-height:52px;line-height:1.38;font-size:1.02rem;transition:background-color .12s,opacity .12s}
.opt:hover:not([aria-disabled="true"]){background:color-mix(in srgb,var(--hl) 40%,var(--label))}
.opt[aria-disabled="true"]{cursor:default}
.ltr{font-family:var(--f-display);font-weight:800;font-size:.85rem;min-width:26px;height:26px;display:inline-grid;place-items:center;border:2px solid currentColor;border-radius:3px;flex:none}
.opt.sel{background:var(--hl);color:var(--hl-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-bg)}
.opt.no .ltr{background:var(--no);border-color:var(--no);color:#fff}
.opt.dim{opacity:.5}
.tf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt.tf{justify-content:center;align-items:center;font-family:var(--f-display);font-weight:900;font-stretch:85%;font-size:1.4rem;text-transform:uppercase;letter-spacing:.03em;min-height:66px}

.fb{scroll-margin-top:84px;scroll-margin-bottom:120px;margin-top:16px;border-top:3px solid var(--ink);padding-top:12px;animation:rise .22s ease-out}
.fb-h{font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:1.45rem;text-transform:uppercase;letter-spacing:.02em;margin:0 0 6px;line-height:1.1}
.fb-h.ok{color:var(--ok)} .fb-h.no{color:var(--no)} .fb-h.part{color:var(--part)}
.fb-h.sm{font-size:1.1rem;margin-top:14px}
.fb-a{font-weight:700}
mark{background:linear-gradient(transparent 40%,var(--hl) 40%,var(--hl) 92%,transparent 92%);color:inherit;padding:0 .12em}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) mark{background:var(--hl);color:var(--hl-ink);border-radius:2px}}
:root[data-theme="dark"] mark{background:var(--hl);color:var(--hl-ink);border-radius:2px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.blank{display:inline-block;min-width:3.4em;border-bottom:2.5px solid var(--ink);text-align:center;font-family:var(--f-display);font-weight:800;font-size:.72em;line-height:1.1;color:var(--muted);vertical-align:baseline;margin:0 2px}
.fill-hint{font-size:.9rem;color:var(--muted);margin:-8px 0 12px}
.fi{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.fi-n{font-family:var(--f-display);font-weight:800;min-width:26px;height:26px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:3px;font-size:.85rem;flex:none}
.fi input{flex:1;min-width:0;min-height:50px;border:2px solid var(--ink);border-radius:4px;padding:8px 12px;background:var(--label);font-size:1.06rem}
.fi input.ok{border-color:var(--ok);background:var(--ok-bg)}
.fi input.no{border-color:var(--no);background:var(--no-bg)}

.m-terms{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
@media (min-width:560px){.m-terms{grid-template-columns:1fr 1fr}}
.m-term{display:flex;gap:10px;align-items:center;border:2px solid var(--ink);border-radius:4px;padding:8px 10px;font-weight:700;line-height:1.25;transition:opacity .12s}
.m-term.used{opacity:.45}
.m-defs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.m-def{border-top:2px solid var(--ink);padding-top:10px}
.m-def p{margin:0 0 8px}
.m-num{font-family:var(--f-display);font-weight:900;margin-right:8px}
.m-picks{display:flex;gap:8px;flex-wrap:wrap}
.pick{width:50px;height:44px;border:2px solid var(--ink);border-radius:4px;background:var(--label);color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1rem}
.pick:hover:not([aria-disabled="true"]){background:color-mix(in srgb,var(--hl) 40%,var(--label))}
.pick[aria-disabled="true"]{cursor:default}
.pick.sel{background:var(--hl);color:var(--hl-ink)}
.pick.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.pick.no{background:var(--no);border-color:var(--no);color:#fff}
.m-res{margin:8px 0 0;font-weight:700}
.m-res.ok{color:var(--ok)} .m-res.no{color:var(--no)}

textarea{width:100%;min-height:150px;border:2px solid var(--ink);border-radius:4px;padding:10px 12px;background:var(--label);font-size:1.02rem;line-height:1.5;resize:vertical}
.checks,.bullets{margin:4px 0 8px;padding:0;list-style:none;display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.4}
.checks input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.bullets li{position:relative;padding-left:22px;line-height:1.4}
.bullets li::before{content:"";position:absolute;left:4px;top:.5em;width:9px;height:9px;background:var(--ink)}
.sa-score{font-family:var(--f-display);font-weight:800;font-size:1.1rem;margin-top:10px}
.model p{line-height:1.55}

.qnav{position:sticky;bottom:0;z-index:10;margin-top:14px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bench) 75%,transparent)}
.qnav-in{display:flex;gap:10px}
.qnav .primary{flex:1}
.kbd-hint{font-size:.8rem;color:var(--muted);text-align:center;margin:4px 0 0}
@media (hover:none){.kbd-hint{display:none}}

/* ---------- results ---------- */
.miss-list{display:grid;gap:12px;margin-top:12px}
.miss{background:var(--label);border:2px solid var(--ink);border-left-width:8px;padding:12px 14px}
.miss .q{font-weight:700;margin-bottom:6px}
.miss .row{font-size:.95rem;margin:2px 0}
.miss .lab{font-family:var(--f-display);font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.miss ul{margin:4px 0 0;padding-left:20px}
.h-sec{font-family:var(--f-display);font-weight:900;font-stretch:78%;font-size:1.8rem;text-transform:uppercase;margin:28px 0 4px;line-height:1}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--label);padding:12px 18px;border-radius:4px;font-family:var(--f-display);font-weight:800;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <button class="brand" data-act="home" aria-label="Food Science Exam Simulator: back to exams">Food Science<small>Exam simulator</small></button>
    <div class="top-actions">
      <div class="timer" id="timer">
        <button class="t-face" id="tFace" aria-expanded="false" aria-controls="tPanel" aria-label="Timer settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.8M9.5 2.5h5M18.4 6.6l1.5-1.5"/></svg>
          <span id="tTime">Timer</span>
        </button>
        <button class="t-play" id="tPlay" aria-label="Start timer"></button>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Switch to dark theme"></button>
    </div>
    <div class="t-panel" id="tPanel" hidden>
      <h2>Timer</h2>

  { q: 'By the last week of each month a family runs out of money, and the parents skip meals so the children can eat. The household is experiencing:', o: ['Food insecurity', 'Food fortification', 'Ecological literacy', 'An anthropogenic effect'], e: 'Difficulty providing enough food for all members due to lack of resources.', ch: 1 },
  { q: 'A clinic asks every patient two quick questions: whether they worried food would run out before they had money to buy more, and whether it did. The clinic is using:', o: ['The Hunger Vital Sign', 'A hedonic scale', 'A triangle test', 'A case-control study'], e: 'A 2-item screen; best practice pairs universal screening with a closed-loop referral.', ch: 1 },
  { q: 'A corn variety has a bacterial gene inserted into its DNA so it makes its own insect toxin. It is a:', o: ['Genetically modified organism (GMO)', 'Functional food', 'Phytochemical', 'Comminuted product'], e: 'GMOs have DNA altered by inserting transgenes not naturally found in the organism.', ch: 1 },
  { q: 'A wheat grower sprays a product that kills dandelions and thistles but leaves the wheat unharmed. The product is a(n):', o: ['Herbicide', 'Enzyme', 'Emulsifier', 'Lectin'], e: 'A herbicide kills unwanted plants while leaving others alone.', ch: 1 },
  { q: 'In a wetland, plants, fish, birds and microbes interact with the water, soil and sunlight as one functioning unit. This is a(n):', o: ['Ecosystem', 'Ecological footprint', 'Monoculture', 'Retort pouch'], e: 'Living communities plus the nonliving environment, interacting as a unit.', ch: 1 },
  { q: 'A rainforest plot holds thousands of species of plants, insects, fungi and microorganisms. Ecologists would say it has high:', o: ['Biodiversity', 'Water activity', 'Marbling', 'Relative risk'], e: 'Biodiversity is the variety of life forms in a community.', ch: 1 },
  { q: 'A dietitian explains to a class how soil health, pollinators, water use and food choices are all connected. The dietitian is demonstrating:', o: ['Ecological literacy', 'Food insecurity', 'Nutrigenomics', 'Molecular gastronomy'], e: 'Understanding the interconnected systems that sustain the web of life.', ch: 1 },
  { q: 'Rising atmospheric CO2 from burning fossil fuels traps more heat near Earth’s surface. This intensifies the:', o: ['Greenhouse effect', 'Maillard reaction', 'Ecological footprint', 'Hydrogenation process'], e: 'A naturally occurring effect, substantially increased by human emissions.', ch: 1 },
  { q: 'A scientist studies how heat changes the proteins in milk so a company can make a safer, longer-lasting product for the public. This work is an example of:', o: ['Food science', 'Ecological literacy', 'Popular press', 'Sensory adaptation'], e: 'Food science studies food’s physical, biochemical and chemical nature, including processing and improving food for public benefit.', ch: 1 },
  // Ch 2
  { q: 'Researchers survey 5,000 adults once, recording each person’s current soda intake and current BMI. Which design is this?', o: ['Cross-sectional survey', 'Prospective cohort', 'Case-control study', 'Double-blind placebo-controlled design'], e: 'Exposure and outcome are measured at one point in time, so it cannot show which came first.', ch: 2 },
  { q: 'Researchers enroll 10,000 healthy nurses, record their diets, and follow them for 20 years to see who develops heart disease. Which design is this?', o: ['Prospective cohort', 'Retrospective cohort', 'Case-control study', 'Cross-sectional survey'], e: 'Classified by exposure and followed forward; the disease has not yet occurred at the start.', ch: 2 },
  { q: 'Using factory records from the 1990s, researchers identify workers who were exposed to a solvent and check which of them have since developed cancer. Which design is this?', o: ['Retrospective cohort', 'Prospective cohort', 'Randomized design', 'Cross-sectional survey'], e: 'Groups are defined by past exposure, and the disease has already occurred when the study begins.', ch: 2 },
  { q: 'Researchers recruit 200 people with stomach cancer and 200 similar people without it, then ask both groups about their past intake of pickled foods. Which design is this?', o: ['Case-control study', 'Prospective cohort', 'Randomized design', 'Cross-sectional survey'], e: 'Case-control studies start with the outcome and look backward at exposures.', ch: 2 },
  { q: 'Participants get either a vitamin D capsule or an identical-looking sugar pill, assigned by computer. Neither the participants nor the researchers know who got which. This is a:', o: ['Double-blind placebo-controlled design', 'Retrospective cohort', 'Case-control study', 'Cross-sectional survey'], e: 'Random assignment + double blinding + placebo = strongest cause-and-effect evidence.', ch: 2 },
  { q: 'A headline says a food “doubles your cancer risk.” In the study, risk went from 1 in 100,000 to 2 in 100,000. What is the most accurate summary?', o: ['Relative risk is 2.0, but the absolute increase is only 1 extra case per 100,000', 'Relative risk is 1.0, so there is no effect', 'Absolute risk doubled from 50% to 100%', 'Relative risk is 0.5, so the food is protective'], e: 'Relative risk = 2 ÷ 1 = 2.0; absolute risk difference = 1 extra case per 100,000. Headlines often report only the relative number.', ch: 2 },
  { q: 'A cereal box says: “Diets low in sodium may reduce the risk of high blood pressure.” This is a:', o: ['Health claim', 'Nutrient content claim', 'Structure/function claim'], e: 'It links a nutrient to a disease or health condition, so FDA must authorize it.', ch: 2 },
  { q: 'A yogurt label says “High in calcium.” This is a:', o: ['Nutrient content claim', 'Health claim', 'Structure/function claim'], e: 'It describes the level of a nutrient.', ch: 2 },
  { q: 'A supplement label says “Fiber supports digestive regularity,” followed by a disclaimer that FDA has not evaluated the statement. This is a:', o: ['Structure/function claim', 'Health claim', 'Nutrient content claim'], e: 'It describes a role in body function: no FDA approval, disclaimer required.', ch: 2 },
  { q: 'A dietitian combines a recent meta-analysis, years of clinical experience, and a client’s cultural food preferences and budget to build a meal plan. This is:', o: ['Evidence-based practice', 'Popular press', 'A case-control study', 'Ecological literacy'], e: 'Sackett: best external evidence + professional expertise + client values and context.', ch: 2 },
  { q: 'A friend wants nutrition advice from someone whose credential is legally protected and can be verified. They should look for:', o: ['An RDN', 'A “nutritionist”', 'A wellness influencer', 'A health coach certificate'], e: '“Nutritionist” is unregulated in many states.', ch: 2 },
  { q: 'A student reads a magazine story by a journalist that summarizes a new diet study for general readers. This source is a:', o: ['Popular press article', 'Peer-reviewed article', 'Case-control study', 'Health claim'], e: 'Written by journalists for the public; found in magazines, newspapers, books.', ch: 2 },
  { q: 'Before a journal publishes a manuscript, three university researchers judge whether its methods are sound and its conclusions supported. The published paper is a:', o: ['Peer-reviewed article', 'Popular press article', 'Structure/function claim', 'Cross-sectional survey'], e: 'Reviewed by academic experts for significance, methods and interpretation.', ch: 2 },
  { q: 'In a weight-loss trial, a coin flip decides whether each participant gets the new diet or the usual diet. This feature is called:', o: ['Randomized design', 'Retrospective design', 'Case-control design', 'Cross-sectional design'], e: 'Subjects are assigned to groups randomly.', ch: 2 },
  // Ch 3
  { q: 'A company wants to know if cutting sugar by 10% makes a noticeable difference. Each panelist gets three samples, two identical, and picks the odd one. This is a:', o: ['Triangle test', 'Duo-trio test', 'Hedonic scale', 'Paired preference test'], e: 'Triangle test: analytical, guessing probability 1/3.', ch: 3 },
  { q: 'Panelists taste a reference sample, then two coded samples, and pick the one that matches the reference. This is a:', o: ['Duo-trio test', 'Triangle test', 'Ranking test', 'Hedonic scale'], e: 'Duo-trio: guessing probability 1/2, so more judgments are needed.', ch: 3 },
  { q: '100 shoppers rate a new granola bar from “dislike extremely” to “like extremely.” This is a:', o: ['Hedonic scale, an affective test', 'Triangle test, an analytical test', 'Descriptive analysis, an analytical test', 'Chemical test, an objective evaluation'], e: 'Rating liking = hedonic scale (affective).', ch: 3 },
  { q: 'A highly trained panel scores the crispness, saltiness and oiliness of five potato chips on a 15-point intensity scale. Which panel is this?', o: ['Descriptive panel', 'Consumer panel', 'Hedonic panel', 'Carrier panel'], e: 'Descriptive panelists are highly trained to quantify specific sensory differences, never consumers.', ch: 3 },
  { q: 'A new salsa is tested served on plain tortilla chips. The chips are the:', o: ['Carrier', 'Reference sample', 'Placebo', 'Hedonic scale'], e: 'A carrier accompanies and is eaten with the tested food.', ch: 3 },
  { q: 'You walk into a bakery and the bread smell is overwhelming, but ten minutes later you barely notice it. This is:', o: ['Adaptation', 'Retronasal olfaction', 'Umami', 'Astringency'], e: 'A gradual decrease in the ability to distinguish odors over time.', ch: 3 },
  { q: 'With a stuffy nose from a cold, a favorite meal tastes bland. The best explanation is:', o: ['Aroma can’t reach the nose (retronasal olfaction), and aroma is ~75% of flavor', 'Taste buds stop working during a cold', 'The tongue map shifts during illness', 'Mouthfeel receptors are blocked'], e: 'Most of what we call flavor is aroma.', ch: 3 },
  { q: 'Strong black tea leaves your mouth feeling dry and puckered. This sensation is part of:', o: ['Mouthfeel (astringency)', 'Umami', 'Retronasal olfaction', 'Adaptation'], e: 'Mouthfeel: astringency, spice heat, cooling, metallic.', ch: 3 },
  { q: 'Parmesan, mushrooms and soy sauce share a savory, brothy taste from glutamate. This taste is:', o: ['Umami', 'Bitter', 'Sour', 'Sweet'], e: 'Umami = glutamate.', ch: 3 },
  { q: 'A lab measures the pH of yogurt to confirm it is acidic enough. This is a(n):', o: ['Chemical test (objective evaluation)', 'Physical test (objective evaluation)', 'Affective test', 'Descriptive panel'], e: 'pH is a chemical test.', ch: 3 },
  { q: 'A juice plant uses a refractometer to check the sugar content of every batch. This is a(n):', o: ['Physical test (objective evaluation)', 'Chemical test (objective evaluation)', 'Affective test', 'Triangle test'], e: 'Sugar concentration by refractometer is a physical test.', ch: 3 },
  { q: 'An instrument measures the force needed to bite through a cookie so a new recipe matches the original’s texture. This is a(n):', o: ['Physical test', 'Chemical test', 'Hedonic test', 'Duo-trio test'], e: 'Texture is measured with physical tests.', ch: 3 },
  { q: 'A chef uses sodium alginate and a calcium bath to turn fruit juice into “caviar” spheres, relying on an understanding of the physical and chemical changes involved. This is:', o: ['Molecular gastronomy', 'Nutrigenomics', 'Comminution', 'Hydrogenation'], e: 'Modern cooking that identifies physical and chemical changes to create the best flavor and texture.', ch: 3 },
  { q: 'A researcher studies why some people’s genes make their blood pressure especially sensitive to salt, and how diet changes gene expression. This field is:', o: ['Nutrigenomics', 'Molecular gastronomy', 'Sensory evaluation', 'Ecological literacy'], e: 'How food affects our genes and how our bodies respond to nutrients.', ch: 3 },
  { q: 'Which question is appropriate to ask a consumer panel?', o: ['“Which sample do you prefer?”', '“Rate the intensity of the metallic aftertaste.”', '“Quantify the astringency of each sample.”', '“Score the crispness on a 15-point scale.”'], e: 'Consumers judge acceptability or preference, never technical attributes.', ch: 3 },
  { q: 'A product developer wants to know whether people like a new low-sugar cookie better than the original. Which type of test fits?', o: ['Affective test', 'Analytical test', 'Chemical test', 'Physical test'], e: 'Liking or preference = affective.', ch: 3 },
  { q: 'Before a taste test, a manager makes sure every sample is served at the same temperature, on the same plate, in the same portion size. Why?', o: ['So the only difference panelists judge is the product itself', 'To raise the guessing probability', 'To turn an affective test into an analytical one', 'To cause adaptation'], e: 'Standardizing temperature, plating and portion size removes outside influences.', ch: 3 },
  // Ch 4
  { q: 'Flour stirred into simmering broth makes the gravy thicken as the starch granules swell. This is:', o: ['Gelatinization', 'Retrogradation', 'Dextrinization', 'Caramelization'], e: 'Starch granules heated in water swell irreversibly (about 60–85 °C).', ch: 4 },
  { q: 'Bread left on the counter for two days turns firm and stale. The main cause is:', o: ['Retrogradation', 'Gelatinization', 'Maillard reaction', 'Hydrogenation'], e: 'Starch chains re-align on cooling and standing.', ch: 4 },
  { q: 'A cook browns flour in fat for a dark gumbo roux and notices it thickens less than a white roux. Why?', o: ['Dextrinization split the starch into shorter chains', 'Gelatinization was blocked by the fat', 'Retrogradation happened in the pan', 'Enzymatic browning destroyed the starch'], e: 'Dry heat → shorter chains → sweeter, browner, thickens less.', ch: 4 },
  { q: 'Leftover pudding in the fridge has a puddle of liquid on top the next day. This weeping (syneresis) is caused by:', o: ['Retrogradation', 'Gelatinization', 'Caramelization', 'Fortification'], e: 'Retrogradation causes bread staling and gels weeping.', ch: 4 },
  { q: 'A steak develops a brown, savory crust in a hot pan as sugars react with amino groups. This is the:', o: ['Maillard reaction', 'Caramelization', 'Enzymatic browning', 'Dextrinization'], e: 'Non-enzymatic reaction of reducing sugars with amino groups.', ch: 4 },
  { q: 'Plain table sugar is heated alone in a dry pan until it turns amber. This is:', o: ['Caramelization', 'Maillard reaction', 'Enzymatic browning', 'Gelatinization'], e: 'Browning of sugar alone under high dry heat.', ch: 4 },
  { q: 'A sliced avocado turns brown on the counter. This is:', o: ['Enzymatic browning by polyphenol oxidase (PPO)', 'The Maillard reaction', 'Caramelization', 'Metmyoglobin formation'], e: 'PPO oxidizes phenols to brown melanin.', ch: 4 },
  { q: 'Green beans are blanched in boiling water before freezing. The main reason is to:', o: ['Inactivate enzymes such as polyphenol oxidase', 'Raise water activity', 'Hydrogenate the oils', 'Add back lost nutrients'], e: 'Blanching inactivates PPO.', ch: 4 },
  { q: 'An egg white turns from clear to opaque and firm in a hot pan. This shows:', o: ['Protein denaturation followed by coagulation', 'Starch gelatinization', 'Hydrogenation', 'Retrogradation'], e: 'Heat disrupts the protein structure; the denatured proteins then congeal.', ch: 4 },
  { q: 'Whisking egg whites unfolds their proteins. Which cause of denaturation is this?', o: ['Mechanical shear', 'Heat', 'Alcohol', 'Salts'], e: 'Causes: heat, alcohol, acids, salts, enzymes, mechanical shear.', ch: 4 },
  { q: 'Egg whites whipped into stiff peaks for meringue are an example of a:', o: ['Food foam', 'Emulsion held together by lecithin', 'Gel formed by retrogradation', 'Comminuted product'], e: 'Air dispersed in a liquid or solid.', ch: 4 },
  { q: 'Oil and lemon juice stay blended in mayonnaise because egg yolk contains:', o: ['Lecithin, a phospholipid emulsifier', 'Cellulose, a fiber', 'Glycogen', 'Lectins'], e: 'A water-loving phosphate head and fat-loving tails bridge oil and water.', ch: 4 },
  { q: 'An older margarine label lists “partially hydrogenated soybean oil.” The margarine likely contains:', o: ['Trans fats', 'Only omega-3 fatty acids', 'No fat', 'Lectins'], e: 'Partial hydrogenation creates trans fats.', ch: 4 },
  { q: 'Beef jerky and honey last for months on the shelf without spoiling because they have:', o: ['Low water activity', 'High water activity', 'High total moisture', 'Added lectins'], e: 'Low water activity stops microbial growth (but doesn’t kill pathogens already present).', ch: 4 },
  { q: 'Iodine is added to table salt to prevent goiter across the population. This is:', o: ['Fortification', 'Enrichment', 'Hydrogenation', 'Comminution'], e: 'Adding nutrients to prevent specific deficiencies in a population.', ch: 4 },
  { q: 'Thiamin, riboflavin, niacin and iron are added back to white flour after milling removes them. This is:', o: ['Enrichment', 'Fortification', 'Dextrinization', 'Hydrolysis'], e: 'Adding back nutrients lost in processing (1972 flour act).', ch: 4 },
  { q: 'A cereal maker adds isolated psyllium fiber with a proven cholesterol-lowering benefit. The psyllium is:', o: ['Functional fiber', 'Dietary fiber', 'Glycogen', 'A phytochemical'], e: 'Isolated, extracted or manufactured indigestible carbohydrate with proven physiological benefit.', ch: 4 },
  { q: 'The fiber found naturally intact in a bowl of whole oats is:', o: ['Dietary fiber', 'Functional fiber', 'Glycogen', 'A lectin'], e: 'Intrinsic and intact in plants = dietary fiber.', ch: 4 },
  { q: 'Potatoes are cooked, then chilled for potato salad, and some of the starch now resists digestion by human enzymes. This is:', o: ['Resistant starch', 'Glycogen', 'A functional food', 'A lectin'], e: 'Starch humans cannot digest enzymatically.', ch: 4 },
  { q: 'Several people get sick after eating red kidney beans cooked only on “low” in a slow cooker. The likely cause is:', o: ['Lectins that weren’t destroyed; beans should be soaked, then boiled hard for 10+ minutes', 'Low water activity', 'Too much resistant starch', 'Retrogradation'], e: 'A slow cooker alone does not reliably destroy lectins.', ch: 4 },
  { q: 'Lycopene, the red pigment in tomatoes, is not an essential nutrient but may help prevent disease. It is a:', o: ['Phytochemical', 'Monosaccharide', 'Lectin', 'Functional fiber'], e: 'Non-nutritive plant chemical that may help prevent disease.', ch: 4 },
  { q: 'Oatmeal is marketed for its beta-glucan, which lowers cholesterol, a benefit beyond basic nutrition. Oatmeal is being presented as a:', o: ['Functional food', 'Fortified food', 'Comminuted product', 'Retort pouch food'], e: 'Health benefits beyond basic nutrition = functional food.', ch: 4 },
  { q: 'Sucrose is split into glucose and fructose using a water molecule. This reaction is:', o: ['Hydrolysis', 'Hydrogenation', 'Dextrinization', 'Coagulation'], e: 'Hydro (water) + lysis (splitting).', ch: 4 },
  { q: 'After slaughter, the carbohydrate stored in muscle is converted to lactic acid. That carbohydrate is:', o: ['Glycogen', 'Cellulose', 'Lactose', 'Resistant starch'], e: 'Glycogen is stored in animal muscle.', ch: 4 },
  // Ch 6
  { q: 'A client eats plant foods plus milk and cheese, but no eggs, meat, poultry or fish. This pattern is:', o: ['Lacto-vegetarian', 'Ovo-vegetarian', 'Lacto-ovo vegetarian', 'Pescatarian'], e: 'Lacto = dairy.', ch: 6 },
  { q: 'A client eats plant foods and eggs, but no dairy or meat. This pattern is:', o: ['Ovo-vegetarian', 'Lacto-vegetarian', 'Vegan', 'Flexitarian'], e: 'Ovo = eggs.', ch: 6 },
  { q: 'A client eats salmon twice a week plus eggs and yogurt, but no beef, pork or poultry. This pattern is:', o: ['Pescatarian', 'Lacto-ovo vegetarian', 'Flexitarian', 'Macrobiotic'], e: 'No meat except fish; may include eggs or dairy.', ch: 6 },
  { q: 'A client eats vegetarian meals most days but has chicken at family gatherings a few times a month. This pattern is:', o: ['Flexitarian', 'Pescatarian', 'Lacto-ovo vegetarian', 'Vegan'], e: 'Primarily vegetarian with occasional meat.', ch: 6 },
  { q: 'A client eats only plant foods and also avoids honey, leather and wool. This pattern is:', o: ['Vegan', 'Lacto-ovo vegetarian', 'Raw food', 'Plant-based'], e: 'Vegan lifestyles exclude all animal-derived products.', ch: 6 },
  { q: 'A client follows a Japanese-origin, grain-based diet of brown rice and local vegetables, avoiding refined foods and most animal products. This pattern is:', o: ['Macrobiotic', 'Fruitarian', 'Raw food', 'Flexitarian'], e: 'That is the macrobiotic pattern.', ch: 6 },
  { q: 'A client’s diet consists of fruits, nuts and seeds. This pattern is:', o: ['Fruitarian', 'Macrobiotic', 'Pescatarian', 'Lacto-vegetarian'], e: 'Fruits, nuts, seeds, sometimes legumes.', ch: 6 },
  { q: 'A client eats mostly uncooked, unprocessed foods such as salads, sprouted seeds and fruit. This pattern is:', o: ['Raw food', 'Macrobiotic', 'Flexitarian', 'Ovo-vegetarian'], e: 'May or may not be fully vegetarian.', ch: 6 },
  { q: 'A self-described vegetarian lives on white bread, fries, soda, fruit juice and candy. What does the evidence suggest?', o: ['A high uPDI score, linked to higher chronic disease risk', 'Lower disease risk because the diet is meat-free', 'A low uPDI score', 'No effect on chronic disease risk'], e: 'Quality matters: “plant-based” isn’t automatically healthful.', ch: 6 },
  { q: 'A new vegan client asks which nutrient they most need to plan for. The best answer is:', o: ['Vitamin B12: use fortified foods or a supplement', 'Vitamin C: eat more citrus', 'Fiber: add a supplement', 'Carbohydrate: eat more grains'], e: 'B12 generally can’t be met from food alone on a vegan diet.', ch: 6 },
  { q: 'Which is NOT a typical reason people choose a vegetarian diet?', o: ['It makes vitamin B12 easier to get', 'Health and chronic disease prevention', 'Environmental sustainability', 'Religious or cultural beliefs'], e: 'Drivers: health, environment, animal welfare and ethics, religion and culture, cost, taste. B12 is actually harder to get on a vegan diet.', ch: 6 },
  // Ch 7
  { q: 'A chuck roast comes from a well-exercised shoulder muscle with lots of connective tissue. The best cooking method is:', o: ['Braising (moist heat) to convert collagen to gelatin', 'Grilling over high heat (dry heat)', 'Broiling briefly', 'Pan-frying quickly'], e: 'Lean, well-exercised cuts have more collagen; moist heat makes them tender.', ch: 7 },
  { q: 'A well-marbled ribeye is best cooked by:', o: ['Grilling or broiling (dry heat); its fat keeps it tender and juicy', 'Stewing for three hours', 'Simmering in water', 'Steaming'], e: 'Marbled cuts rely on intramuscular fat; dry heat also adds Maillard browning.', ch: 7 },
  { q: 'A package of ground beef is bright red on the surface but purplish-red in the center. Why?', o: ['Oxymyoglobin formed where oxygen reached the surface; myoglobin remains inside', 'The center has turned to metmyoglobin', 'The surface was cured with nitric oxide', 'The center contains more collagen'], e: 'Myoglobin (purplish-red) + oxygen → oxymyoglobin (bright red).', ch: 7 },
  { q: 'A slice of deli ham is pink even after cooking. The pigment responsible is:', o: ['Nitric oxide myoglobin', 'Oxymyoglobin', 'Metmyoglobin', 'Elastin'], e: 'Nitric oxide myoglobin is the pink pigment of cured meats.', ch: 7 },
  { q: 'A butcher trims the shiny, silvery membrane off a pork tenderloin because it won’t soften during cooking. That membrane is mostly:', o: ['Elastin', 'Collagen', 'Marbling', 'Myoglobin'], e: 'Elastin resists cooking and must be trimmed.', ch: 7 },
  { q: 'A cook makes beef stew but pours off and discards the broth. What happens to nutrition?', o: ['50% or more of the water-soluble nutrients can be lost', 'Most of the iron and zinc is lost', 'Nothing; the nutrients stay in the meat', 'Only fat is lost'], e: 'Iron and zinc are retained either way; water-soluble nutrients leach into the liquid.', ch: 7 },
  { q: 'A rancher pays to have beef rated “USDA Choice.” This is:', o: ['Grading: voluntary, producer-paid, by USDA AMS', 'Inspection: mandatory, taxpayer-funded, by USDA FSIS', 'Seafood HACCP', 'NOAA grading'], e: 'Grading rates quality: tenderness, juiciness, flavor.', ch: 7 },
  { q: 'A pork processing plant must have federal inspectors confirm its meat is wholesome and safe. This is:', o: ['Inspection: mandatory, by USDA FSIS', 'Grading: voluntary, by USDA AMS', 'NOAA grading', 'A structure/function claim'], e: 'Inspection is mandatory for beef, veal, pork and lamb.', ch: 7 },
  { q: 'After three hours of slow simmering, a tough pot roast becomes fork-tender. Why?', o: ['Collagen broke down to gelatin under moist heat', 'Elastin melted', 'More marbling formed', 'Myoglobin turned to metmyoglobin'], e: 'Moist heat converts collagen to gelatin.', ch: 7 },
  { q: 'A steak in the fridge turns brownish-red on the surface after days of air exposure. The pigment is:', o: ['Metmyoglobin', 'Oxymyoglobin', 'Nitric oxide myoglobin', 'Myoglobin'], e: 'Excessive oxygen converts the iron to the ferric state.', ch: 7 },
  { q: 'Grilling a lean, well-exercised cut like eye of round over high heat often makes it:', o: ['Tough and dry: dry heat causes more moisture loss and toughens lean cuts', 'Very tender, because dry heat converts elastin to gelatin', 'Higher in water-soluble vitamins', 'Pink from nitric oxide myoglobin'], e: 'Lean cuts do better with moist heat.', ch: 7 },
  // Ch 8
  { q: 'Imitation crab is made from finely minced fish formed into sticks. It is a:', o: ['Comminuted product', 'Functional fiber', 'Retort pouch', 'Fortified food'], e: 'Comminuted products use animal parts as fillers in processed products (fish sticks, surimi).', ch: 8 },
  { q: 'Tuna is sold in a shelf-stable, flexible foil package that is free of microorganisms. The package is a:', o: ['Retort pouch', 'Comminuted product', 'HACCP plan', 'Carrier'], e: 'A flexible, aseptic container.', ch: 8 },
  { q: 'Tilapia raised in managed ponds and sold to grocery stores is a product of:', o: ['Aquaculture', 'Comminution', 'Fortification', 'Hydrogenation'], e: 'Farming of fish and other aquatic species.', ch: 8 },
  { q: 'A recipe calls for a lean fish. Which should you buy?', o: ['Cod', 'Salmon', 'Mackerel', 'Tuna'], e: 'Lean (under 5 g fat per 3 oz): cod, haddock, tilapia. Salmon, mackerel and tuna are fatty (5–10 g).', ch: 8 },
  { q: 'A company starts importing shrimp into the U.S. Which program must it follow?', o: ['FDA Seafood HACCP (mandatory)', 'NOAA grading (voluntary)', 'USDA AMS grading', 'No program applies to imports'], e: 'Seafood HACCP is mandatory for domestic processors and importers.', ch: 8 },
  { q: 'A seafood processor pays NOAA to evaluate and label the quality of its fish. This program is:', o: ['Voluntary, fee-for-service grading', 'Mandatory inspection', 'Seafood HACCP', 'Taxpayer-funded inspection'], e: 'NOAA grading is voluntary.', ch: 8 },
  { q: 'A cod fillet is done in about 10 minutes, but a beef chuck roast needs hours. Why?', o: ['Fish has short muscle fibers, much less collagen, and connective tissue that denatures easily', 'Fish has more elastin', 'Fish has more marbling', 'Fish has more myoglobin'], e: 'That is why fish cooks faster than beef.', ch: 8 },
  { q: 'At a processing plant, fish trimmings are finely diced by machine. This step is called:', o: ['Comminution', 'Aquaculture', 'Hydrolysis', 'Retrogradation'], e: 'Finely dicing meat during industrial processing.', ch: 8 },
  // General
  { q: 'A carton of milk stays shelf-stable until opened because it was heated to 280–300 °F for 2–6 seconds and packaged aseptically. It was processed by:', o: ['UHT processing', 'Hydrogenation', 'Comminution', 'Dextrinization'], e: 'UHT milk: 280–300 °F for 2–6 seconds.', ch: 0, f: 1 }
];

const EXAM1_FILL = [
  // From the review guide
  { q: '____ tests are the most comprehensive and informative sensory tools and require a well-trained panel.', b: [['descriptive', 'descriptive analysis']], ans: 'Descriptive', e: 'Descriptive panelists are highly trained to identify and quantify specific sensory characteristics.', ch: 3, g: 1 },
  { q: '____ is the gradual decrease in the ability to distinguish odors over time.', b: [['adaptation']], ans: 'Adaptation', ch: 3, g: 1 },
  { q: '____ is the combined senses of taste, aroma and mouthfeel.', b: [['flavor', 'flavour']], ans: 'Flavor', ch: 3, g: 1 },
  { q: '____ evaluation relies on quantifiable results from laboratory instruments.', b: [['objective']], ans: 'Objective', e: 'Its two types are physical tests and chemical tests.', ch: 3, g: 1 },

function norm(s) {
  return String(s).toLowerCase()
    .replace(/α/g, ' alpha ').replace(/β/g, ' beta ')
    .normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/(\d),(?=\d{3})/g, '$1')
    .replace(/[^a-z0-9./ ]+/g, ' ')
    .replace(/\.(?!\d)/g, ' ').replace(/(^|[^0-9])\./g, '$1 ')
    .split(/\s+/).filter(w => /[a-z0-9]/.test(w))
    .map(w => (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) ? w.slice(0, -1) : w)
    .join(' ');
}
const NEG = new Set(['non', 'not', 'no', 'un']);
function matchBlank(input, accepted) {
  const x = norm(input);
  if (!x) return false;
  const xw = ` ${x} `;
  return accepted.some(a => {
    const y = norm(a);
    if (!y) return false;
    if (x === y) return true;
    if (!xw.includes(` ${y} `)) return false;
    const yw = new Set(y.split(' '));
    return !x.split(' ').some(w => NEG.has(w) && !yw.has(w));
  });
}

  return [term.t].concat(term.al || []).some(a => core(a) === x);
}

    let others = all.filter(o => o !== t && o.ch === t.ch && !avoidPair(t, o));

function buildExam() {
  const E = exam(), take = (a, n) => shuffle(a || []).slice(0, n);
  return [].concat(
    matchSets(E.terms).slice(0, 2).map(src => ({ cat: 'match', src, sec: 'Part A · Matching' })),
    take(E.tf, 10).map(src => ({ cat: 'tf', src, sec: 'Part B · True / false' })),
    take((E.mc || []).map(src => ({ cat: 'mc', src })).concat((E.scen || []).map(src => ({ cat: 'scen', src }))), 10).map(x => Object.assign(x, { sec: 'Part C · Multiple choice' })),
    take(E.fill, 5).map(src => ({ cat: 'fill', src, sec: 'Part D · Fill in the blank' })),
    take(E.short, 3).map(src => ({ cat: 'short', src, sec: 'Part E · Short answer' }))
  );
}
function prep(en) {
  const it = { cat: en.cat, src: en.src, sec: en.sec, kind: en.cat === 'scen' ? 'mc' : en.cat, resp: null, done: false, pts: 0, max: 1 };
  const s = en.src;
  if (it.kind === 'mc') {
    let ord = s.o.map((_, i) => i);
    if (!s.keep) ord = shuffle(ord);
    it.opts = ord.map(i => s.o[i]);
    it.ans = ord.indexOf(s.a || 0);
  } else if (it.kind === 'fill') {
    it.resp = s.b.map(() => '');
  } else if (it.kind === 'match') {
    it.terms = shuffle(s.terms);
    it.defs = shuffle([0, 1, 2, 3]);
    it.resp = [null, null, null, null];
    it.max = 4;
  } else if (it.kind === 'short') {
    it.resp = '';
    it.chk = s.pts.map(() => false);
    it.max = 10;
  }
  if (S.mode === 'answer') it.done = true;
  return it;
}
function startQuiz(type) {
  let entries;
  if (type === 'match') entries = matchSets(termScope()).map(src => ({ cat: 'match', src }));
  else if (type === 'exam') entries = buildExam();
  else {
    entries = shuffle(pool(type));
    if (S.filt.n !== 'all') entries = entries.slice(0, +S.filt.n);
  }
  if (!entries.length) return;
  launch(type, entries, false);
}
function launch(type, entries, retry) {
  S.quiz = { type, retry, mode: S.mode, items: entries.map(prep), i: 0 };
  S.view = 'quiz';
  render(true);
}
const cur = () => S.quiz.items[S.quiz.i];

/* ---------- grading actions ---------- */
function choose(v) {
  const it = cur();
  if (it.done) return;
  it.resp = v;
  it.done = true;
  it.pts = (it.kind === 'tf' ? v === it.src.a : v === it.ans) ? 1 : 0;
  render();
  focusPrimary();
  revealScroll();
}
function check() {
  const it = cur();
  if (it.done) return;
  if (it.kind === 'fill') {
    const s = it.src;
    let res;
    if (s.recall) res = [matchTerm(it.resp[0], s.term)];
    else if (s.any) {
      const used = new Set();
      res = it.resp.map(r => {
        const k = s.b.findIndex((acc, bi) => !used.has(bi) && matchBlank(r, acc));
        if (k >= 0) { used.add(k); return true; }
        return false;
      });
    } else res = it.resp.map((r, bi) => matchBlank(r, s.b[bi]));
    it.res = res;
    it.pts = res.filter(Boolean).length / res.length;
  } else if (it.kind === 'match') {
    it.pts = it.resp.filter((t, r) => t === it.defs[r]).length;
  } else if (it.kind === 'short') {
    it.pts = 0;
  }
  it.done = true;
  render();
  if (it.kind !== 'short') focusPrimary();
  revealScroll();
}
function focusPrimary() {
  const b = app.querySelector('[data-fk="primary"]');
  if (b) b.focus({ preventScroll: true });
}
function go(d) {
  const q = S.quiz, j = q.i + d;
  if (j < 0) return;
  if (j >= q.items.length) { S.view = 'results'; render(true); return; }
  q.i = j;
  render(true);
}
function primary() {
  const it = cur();
  if (!it.done && (it.kind === 'fill' || it.kind === 'match' || it.kind === 'short')) check();
  else go(1);
}
function revealScroll() {
  const fb = document.getElementById('fb');
  if (fb && fb.getBoundingClientRect().bottom > window.innerHeight - 90) {
    const tall = fb.offsetHeight > window.innerHeight * 0.55;
    fb.scrollIntoView({ block: tall ? 'start' : 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
  }
}
function leaveQuiz(to) {
  const q = S.quiz;
  const touched = q && q.mode === 'sim' && S.view === 'quiz' && q.items.some(i => i.done);
  if (touched && !confirm('Leave this round? Your answers so far will not be saved.')) return;
  S.view = to;
  render(true);
}

/* ---------- views ---------- */

function vHome() {
  return `
  <h1 class="sr">Food Science Exam Simulator</h1>

}

function vTypes() {
  const E = exam(), f = S.filt, sim = S.mode === 'sim';
  const chOpts = [['all', 'All chapters'], ['facts', 'Key facts and figures only']].concat(E.chapters.map(c => [String(c), `Ch ${c} · ${CHAPTERS[c]}`]));
  const nOpts = [['all', 'All'], ['10', '10'], ['20', '20'], ['30', '30']];
  const opt = (arr, v) => arr.map(([k, l]) => `<option value="${k}"${k === v ? ' selected' : ''}>${esc(l)}</option>`).join('');
  const rows = TYPES.map(t => {
    const n = poolCount(t.id);
    let unit = t.id === 'match' ? 'terms' : 'items';
    let sub = t.sub;
    if (t.id === 'tf' || t.id === 'fill') sub = autoOn() ? `${t.sub.split('.')[0]}. Includes ${Math.min(AUTO_N, termScope().length)} random key-term questions.` : t.sub;
    if (t.id === 'match') sub = `Sets of 4 · ${Math.ceil(n / 4)} sets, reshuffled every round`;
    const per = (t.id !== 'match' && f.n !== 'all' && n > +f.n) ? `<small>${f.n} per round</small>` : `<small>${unit}</small>`;
    return `<button class="type-row" data-act="start" data-type="${t.id}"${n ? '' : ' disabled'}>
      <span class="tr-name"><b>${t.name}</b><small>${n ? esc(sub) : 'None for this filter'}</small></span>
      <span class="tr-n">${n}${per}</span><span aria-hidden="true">›</span></button>`;
  }).join('');
  return `
  <div class="crumbs">
    <button class="linkbtn" data-act="home">‹ Exams</button>
    <button class="linkbtn" data-act="switch-mode">Switch to ${sim ? 'mode 1 · answer' : 'mode 2 · simulation'}</button>
  </div>
  <section class="nf">
    <h1 class="nf-title">Question Types</h1>
    <p class="nf-sub"><b>${esc(E.name)}</b> · <span class="mode-chip">${MODE_NAME[S.mode]}</span></p>
    <p class="nf-sub muted">${sim ? 'Answer each question, then the correct answer and explanation appear.' : 'Every answer is shown right away.'}</p>
    <hr class="nf-bar">
    <div class="filters">
      <label class="field">Chapter<select data-filter="ch">${opt(chOpts, f.ch)}</select></label>
      <label class="field">Questions per round<select data-filter="n">${opt(nOpts, f.n)}</select></label>
      <label class="chk"><input type="checkbox" data-filter="guide"${f.guide ? ' checked' : ''}> Review-guide questions only</label>
      <label class="chk"><input type="checkbox" data-filter="auto"${f.auto ? ' checked' : ''}${f.guide ? ' disabled' : ''}> Mix key-term questions into true/false and fill in the blank</label>
    </div>
    <hr class="nf-bar mid">
    <div class="nf-head"><span>Pick a type to start</span><span>Amount</span></div>
    ${rows}
    <hr class="nf-bar">
    <button class="type-row exam" data-act="start" data-type="exam">
      <span class="tr-name"><b>Full practice exam</b><small>2 matching sets · 10 true/false · 10 multiple choice · 5 fill-in · 3 short answer. All chapters; ignores the filters above.</small></span>
      <span class="tr-n">30<small>items</small></span><span aria-hidden="true">›</span></button>
  </section>`;
}

function eyebrow(it) {
  const p = [];
  if (it.sec) p.push(`<span>${esc(it.sec)}</span>`);
  if (it.kind === 'match') {
    const chs = Array.from(new Set(it.terms.map(t => t.ch))).sort((a, b) => a - b);
    p.push(`<span>${chs.map(c => 'Ch ' + c).join(' · ')}</span>`);
  } else p.push(`<span>${esc(chName(it.src.ch))}</span>`);
  if (it.src.g) p.push('<span class="tag g">Review guide</span>');
  if (it.src.f) p.push('<span class="tag">Key fact</span>');
  if (it.src.auto) p.push('<span class="tag">Key-term check</span>');
  return `<div class="eyebrow">${p.join('')}</div>`;
}
function feedback(it, sim, inner) {
  let h;
  if (!sim) h = '<p class="fb-h">Answer</p>';
  else {
    const full = it.pts >= it.max, part = it.pts > 0 && !full;
    h = `<p class="fb-h ${full ? 'ok' : part ? 'part' : 'no'}">${full ? 'Correct' : part ? 'Partly right' : 'Not quite'}</p>`;
  }
  return `<div class="fb" id="fb" role="status">${h}${inner}</div>`;
}
const optState = (it, v, correct) => it.done ? (v === correct ? 'ok' : (it.resp === v ? 'no' : 'dim')) : (it.resp === v ? 'sel' : '');

function bTF(it, sim) {
  const s = it.src;
  const head = s.kt
    ? `<p class="q-prompt">True or false: this definition matches the term</p><p class="q-text"><span class="kt-term">${esc(s.term)}</span>“${esc(s.def)}”</p>`
    : `<p class="q-prompt">True or false</p><p class="q-text">${s.q}</p>`;
  const btn = v => `<button class="opt tf ${optState(it, v, s.a)}" data-act="choose" data-v="${v ? 1 : 0}" data-fk="tf${v ? 1 : 0}"${it.done ? ' aria-disabled="true"' : ''}>${v ? 'True' : 'False'}</button>`;
  const fb = it.done ? feedback(it, sim, `<p class="fb-a">Answer: <mark>${s.a ? 'True' : 'False'}</mark></p>${s.e ? `<p>${s.e}</p>` : ''}`) : '';
  return `${head}<div class="tf-row" role="group" aria-label="Your answer">${btn(true)}${btn(false)}</div>${fb}`;
}
function bMC(it, sim) {
  const s = it.src;
  const opts = it.opts.map((o, i) => `<button class="opt ${optState(it, i, it.ans)}" data-act="choose" data-v="${i}" data-fk="o${i}"${it.done ? ' aria-disabled="true"' : ''}><span class="ltr">${LETTERS[i]}</span><span>${o}</span></button>`).join('');
  const fb = it.done ? feedback(it, sim, `<p class="fb-a">Answer: <mark>${LETTERS[it.ans]}. ${it.opts[it.ans]}</mark></p>${s.e ? `<p>${s.e}</p>` : ''}`) : '';
  return `<p class="q-prompt">${it.cat === 'scen' ? 'Scenario: apply the term' : 'Multiple choice'}</p><p class="q-text">${s.q}</p><div class="opts">${opts}</div>${fb}`;
}
function bFill(it, sim) {
  const s = it.src, many = s.b.length > 1;
  let head;
  if (s.recall) head = `<p class="q-prompt">Name the key term</p><blockquote class="defq">${esc(s.def)}</blockquote>`;
  else {
    let k = 0;
    head = `<p class="q-prompt">Fill in the blank</p><p class="q-text">${s.q.replace(/____/g, () => `<span class="blank">${many ? ++k : '&nbsp;'}</span>`)}</p>`;
  }
  if (s.any && sim && !it.done) head += '<p class="fill-hint">Any order is fine.</p>';
  let inputs = '';
  if (sim) {
    inputs = s.b.map((_, bi) => {
      const cls = it.done ? ((it.over || it.res[bi]) ? 'ok' : 'no') : '';
      return `<label class="fi"><span class="fi-n" aria-hidden="true">${many ? bi + 1 : '✎'}</span><input type="text" class="${cls}" data-b="${bi}" data-fk="b${bi}" value="${esc(it.resp[bi])}"${it.done ? ' readonly' : ''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="${many ? 'Blank ' + (bi + 1) : 'Your answer'}"></label>`;
    }).join('');
  }
  let fb = '';
  if (it.done) {
    let extra = '';
    if (sim && it.over) extra = '<p class="muted">Counted as correct.</p>';
    else if (sim && it.pts < 1) extra = '<button class="linkbtn" data-act="override">I had it right. Count it.</button>';
    fb = feedback(it, sim, `<p class="fb-a">Answer: <mark>${esc(s.ans)}</mark></p>${s.recall ? `<p>${esc(s.term.t)}: ${esc(s.term.d)}.</p>` : (s.e ? `<p>${s.e}</p>` : '')}${extra}`);
  }
  return head + inputs + fb;
}
function bMatch(it, sim) {
  const used = new Set(it.resp.filter(x => x !== null));
  const terms = it.terms.map((t, i) => `<li class="m-term${!it.done && used.has(i) ? ' used' : ''}"><span class="ltr">${LETTERS[i]}</span>${esc(t.t)}</li>`).join('');
  const defs = it.defs.map((ti, r) => {
    const t = it.terms[ti], picked = it.resp[r];
    const picks = [0, 1, 2, 3].map(j => {
      let c = '';
      if (it.done) { if (j === ti) c = 'ok'; else if (sim && picked === j) c = 'no'; }
      else if (picked === j) c = 'sel';
      return `<button class="pick ${c}" data-act="mpick" data-r="${r}" data-t="${j}" data-fk="m${r}${j}" aria-pressed="${picked === j}" aria-label="Definition ${r + 1}: term ${LETTERS[j]}"${it.done ? ' aria-disabled="true"' : ''}>${LETTERS[j]}</button>`;
    }).join('');
    let res = '';
    if (it.done) {
      const ok = picked === ti;
      res = sim ? `<p class="m-res ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'} ${LETTERS[ti]} · ${esc(t.t)}</p>` : `<p class="m-res">${LETTERS[ti]} · ${esc(t.t)}</p>`;
    }
    return `<li class="m-def"><p><span class="m-num">${r + 1}.</span>${esc(t.d)}</p><div class="m-picks">${picks}</div>${res}</li>`;
  }).join('');
  const fb = it.done && sim ? feedback(it, sim, `<p class="fb-a">${it.pts} of 4 matched.</p>`) : '';
  return `<p class="q-prompt">Match each definition to a term</p><ul class="m-terms">${terms}</ul><ol class="m-defs">${defs}</ol>${fb}`;
}
function bShort(it, sim) {
  const s = it.src;
  let h = `<p class="q-prompt">Short answer · 10 points</p><p class="q-text">${s.q}</p>`;
  if (sim) h += `<label class="sr" for="sa">Your answer</label><textarea id="sa" data-sa="1" data-fk="sa" rows="7" placeholder="Write your answer here, then check it against the key points."${it.done ? ' readonly' : ''}>${esc(it.resp)}</textarea>`;
  if (it.done) {
    const pts = sim
      ? `<ul class="checks">${s.pts.map((p, k) => `<li><label><input type="checkbox" data-sachk="${k}"${it.chk[k] ? ' checked' : ''}><span>${p}</span></label></li>`).join('')}</ul>
         <p class="sa-score">Self-score: <span id="saScore">${it.pts}</span> / 10 <span class="muted" style="font-family:var(--f-body);font-weight:400;font-size:.9rem">Tick each point your answer covered.</span></p>`
      : `<ul class="bullets">${s.pts.map(p => `<li>${p}</li>`).join('')}</ul>`;
    h += `<div class="fb" id="fb"><p class="fb-h">Key points to include</p>${pts}<p class="fb-h sm">Model answer</p><div class="model">${s.ans.map(p => `<p>${p}</p>`).join('')}</div></div>`;
  }
  return h;
}

function vQuiz() {
  const q = S.quiz, it = cur(), n = q.items.length, sim = q.mode === 'sim', last = q.i === n - 1;
  const done = q.items.filter(x => x.done);
  const pts = done.reduce((a, x) => a + x.pts, 0), max = done.reduce((a, x) => a + x.max, 0);
  const body = it.kind === 'tf' ? bTF(it, sim) : it.kind === 'mc' ? bMC(it, sim) : it.kind === 'fill' ? bFill(it, sim) : it.kind === 'match' ? bMatch(it, sim) : bShort(it, sim);
  let label;
  if (!it.done) label = it.kind === 'fill' ? 'Check answer' : it.kind === 'match' ? 'Check matches' : it.kind === 'short' ? 'Show key points' : (last ? 'Skip and finish' : 'Skip ›');
  else label = last ? (sim ? 'Finish and see score' : 'Finish') : 'Next ›';
  const counter = it.kind === 'match' ? `Set ${q.i + 1} of ${n}` : `${q.i + 1} of ${n}`;
  return `
  <div class="quiz-top">
    <button class="linkbtn" data-act="types">‹ Question types</button>
    <button class="linkbtn" data-act="finish">${sim ? 'End and score' : 'End review'}</button>
  </div>
  <div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${q.i + 1}" aria-label="Progress"><span style="width:${((q.i + 1) / n) * 100}%"></span></div>
  <div class="qmeta"><span>${TYPE_NAME[q.type]}${q.retry ? ' · retry' : ''} · ${sim ? 'Simulation' : 'Answer mode'}</span><span>${counter}</span>${sim ? `<span class="sc">Score ${fmtPts(pts)} / ${max}</span>` : ''}</div>
  <article class="card" id="qcard" tabindex="-1" aria-label="Question ${q.i + 1} of ${n}">
    ${eyebrow(it)}
    ${body}
  </article>
  <nav class="qnav" aria-label="Question navigation"><div class="qnav-in">
    <button class="btn" data-act="prev"${q.i === 0 ? ' disabled' : ''}>‹ Back</button>
    <button class="btn primary" data-act="primary" data-fk="primary">${label}</button>
  </div><p class="kbd-hint">Keys: T / F, 1–4, Enter, ← →</p></nav>`;
}

function missCard(it) {
  const s = it.src;
  const yours = v => `<p class="row"><span class="lab">Your answer</span>${v}</p>`;
  const answer = v => `<p class="row"><span class="lab">Answer</span><mark>${v}</mark></p>`;
  if (it.kind === 'tf') {
    const q = s.kt ? `<b>${esc(s.term)}</b>: “${esc(s.def)}”` : s.q;
    return `<div class="miss"><p class="q">${q}</p>${answer(s.a ? 'True' : 'False')}${yours(it.done ? (it.resp ? 'True' : 'False') : 'Skipped')}${s.e ? `<p class="row">${s.e}</p>` : ''}</div>`;
  }
  if (it.kind === 'mc') return `<div class="miss"><p class="q">${s.q}</p>${answer(it.opts[it.ans])}${yours(it.done ? it.opts[it.resp] : 'Skipped')}${s.e ? `<p class="row">${s.e}</p>` : ''}</div>`;
  if (it.kind === 'fill') {
    const q = s.recall ? `Name the key term: “${esc(s.def)}”` : s.q;
    const typed = it.resp.map(r => r.trim() ? esc(r) : '(blank)').join('; ');
    return `<div class="miss"><p class="q">${q}</p>${answer(esc(s.ans))}${yours(it.done ? typed : 'Skipped')}</div>`;
  }
  if (it.kind === 'match') {
    const wrong = it.defs.map((ti, r) => ({ t: it.terms[ti], ok: it.resp[r] === ti })).filter(x => !x.ok || !it.done);
    return `<div class="miss"><p class="q">Matching set${it.done ? '' : ' (skipped)'}</p><ul>${wrong.map(x => `<li><b>${esc(x.t.t)}</b>: ${esc(x.t.d)}</li>`).join('')}</ul></div>`;
  }
  const missing = s.pts.filter((_, k) => !it.chk[k]);
  return `<div class="miss"><p class="q">${s.q}</p><p class="row"><span class="lab">Self-score</span>${it.done ? it.pts + ' / 10' : 'Skipped'}</p><p class="row"><span class="lab">Points to add</span></p><ul>${missing.map(p => `<li>${p}</li>`).join('')}</ul></div>`;
}

function vResults() {
  const q = S.quiz, sim = q.mode === 'sim', items = q.items;
  const title = TYPE_NAME[q.type] + (q.retry ? ' · retry' : '');
  const timerRow = timerUsed() ? `<div class="nf-row"><span>Time on the timer</span><span class="v">${fmtTime(T.mode === 'down' ? Math.max(0, T.min * 60000 - tElapsed()) : tElapsed())}${T.mode === 'down' ? ' left' : ''}</span></div>` : '';
  const btns = (missedN) => `<div class="btn-row">
      ${missedN ? `<button class="btn primary" data-act="retry">Retry the ${missedN} missed</button>` : ''}
      <button class="btn${missedN ? '' : ' primary'}" data-act="again">New round</button>
      <button class="btn" data-act="types">Question types</button></div>`;
  if (!sim) {
    return `<section class="nf"><h1 class="nf-title">Review Facts</h1><p class="nf-sub"><b>${esc(title)}</b> · Answer mode</p><hr class="nf-bar">
      <div class="nf-big"><span class="k"><small>Amount reviewed</small>Items</span><span class="v">${q.i + 1}<span style="font-size:.5em"> / ${items.length}</span></span></div><hr class="nf-bar mid">
      ${timerRow}<div class="nf-row"><span>Ready to test yourself?</span><span class="v"><button class="linkbtn" data-act="switch-mode-types">Switch to simulation</button></span></div>
      <hr class="nf-bar">${btns(0)}</section>`;
  }
  const answered = items.filter(i => i.done).length;
  const pts = items.reduce((a, i) => a + (i.done ? i.pts : 0), 0), max = items.reduce((a, i) => a + i.max, 0);
  const pct = max ? Math.round(100 * pts / max) : 0;
  const groups = {};
  items.forEach(i => { const k = i.sec || TYPE_NAME[i.cat]; groups[k] = groups[k] || { p: 0, m: 0 }; groups[k].p += i.done ? i.pts : 0; groups[k].m += i.max; });
  const gk = Object.keys(groups);
  const groupRows = gk.length > 1 ? gk.map(k => `<div class="nf-row indent"><span>${esc(k)}</span><span class="v">${fmtPts(groups[k].p)} / ${groups[k].m}</span></div>`).join('') : '';
  const missed = items.filter(i => !i.done || i.pts < i.max);
  return `
  <section class="nf">
    <h1 class="nf-title">Score Facts</h1>
    <p class="nf-sub"><b>${esc(title)}</b> · Simulation mode</p>
    <hr class="nf-bar">
    <div class="nf-big"><span class="k"><small>Amount correct</small>Score</span><span class="v">${pct}%</span></div>
    <hr class="nf-bar mid">
    <div class="nf-row"><span><b>Points</b></span><span class="v">${fmtPts(pts)} / ${max}</span></div>
    ${groupRows}
    <div class="nf-row"><span><b>Answered</b></span><span class="v">${answered} of ${items.length}</span></div>
    ${timerRow}
    <hr class="nf-bar">
    ${btns(missed.length)}
    <p class="nf-foot">${items.some(i => i.kind === 'short') ? '* Short answers are self-scored from the key-point checklist.' : '* Retry the missed ones until they stick.'}</p>
  </section>
  ${missed.length ? `<h2 class="h-sec">Review what you missed</h2><div class="miss-list">${missed.map(missCard).join('')}</div>` : '<h2 class="h-sec">Nothing missed. Nice work.</h2>'}`;
}

function render(toTop) {
  const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : null;
  const v = S.view;
  app.className = 'wrap' + (v === 'home' ? ' wide' : '');
  app.innerHTML = v === 'home' ? vHome() : v === 'types' ? vTypes() : v === 'quiz' ? vQuiz() : vResults();
  if (toTop) {
    window.scrollTo(0, 0);
    const card = document.getElementById('qcard');
    if (card) card.focus({ preventScroll: true });
  } else if (fk) {
    const el = app.querySelector(`[data-fk="${fk}"]`);
    if (el) el.focus({ preventScroll: true });
  }
}

/* ---------- events ---------- */
const ACT = {
  'home': () => { if (S.view === 'quiz') leaveQuiz('home'); else { S.view = 'home'; render(true); } },
  'start-mode': b => { S.examId = b.dataset.exam; S.mode = b.dataset.mode; S.view = 'types'; render(true); },
  'switch-mode': () => { S.mode = S.mode === 'sim' ? 'answer' : 'sim'; render(); },
  'switch-mode-types': () => { S.mode = 'sim'; S.view = 'types'; render(true); },
  'start': b => startQuiz(b.dataset.type),
  'types': () => { if (S.view === 'quiz') leaveQuiz('types'); else { S.view = 'types'; render(true); } },
  'finish': () => { S.view = 'results'; render(true); },
  'choose': b => {
    const it = cur();
    choose(it.kind === 'tf' ? b.dataset.v === '1' : +b.dataset.v);
  },
  'mpick': b => {
    const it = cur();
    if (it.done) return;
    const r = +b.dataset.r, t = +b.dataset.t;
    if (it.resp[r] === t) it.resp[r] = null;
    else { it.resp = it.resp.map(x => x === t ? null : x); it.resp[r] = t; }
    render();
  },
  'override': () => { const it = cur(); it.over = true; it.pts = 1; render(); },
  'prev': () => go(-1),
  'primary': () => primary(),
  'retry': () => {
    const missed = S.quiz.items.filter(i => !i.done || i.pts < i.max);
    const type = S.quiz.type;
    launch(type, shuffle(missed.map(i => ({ cat: i.cat, src: i.src, sec: i.sec }))), true);
  },
  'again': () => startQuiz(S.quiz.type)
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || b.getAttribute('aria-disabled') === 'true') return;
  const fn = ACT[b.dataset.act];
  if (fn) fn(b, e);
});
app.addEventListener('input', e => {
  const el = e.target;
  if (S.view !== 'quiz') return;
  const it = cur();
  if (el.dataset.b != null && it.kind === 'fill' && !it.done) it.resp[+el.dataset.b] = el.value;
  if (el.dataset.sa && !it.done) it.resp = el.value;
});
app.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.filter) {
    const k = el.dataset.filter;
    S.filt[k] = el.type === 'checkbox' ? el.checked : el.value;
    render();
    return;
  }
  if (el.dataset.sachk != null) {
    const it = cur();
    it.chk[+el.dataset.sachk] = el.checked;
    it.pts = Math.round(10 * it.chk.filter(Boolean).length / it.chk.length);
    const sc = document.getElementById('saScore');
    if (sc) sc.textContent = it.pts;
    const meta = app.querySelector('.qmeta .sc');
    if (meta) {
      const done = S.quiz.items.filter(x => x.done);
      meta.textContent = `Score ${fmtPts(done.reduce((a, x) => a + x.pts, 0))} / ${done.reduce((a, x) => a + x.max, 0)}`;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !tPanel.hidden) { closePanel(); tFace.focus(); return; }
  if (S.view !== 'quiz' || e.metaKey || e.ctrlKey || e.altKey) return;
  const el = e.target, tag = el.tagName;
  if (tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (tag === 'INPUT' && el.type !== 'checkbox') {
    if (e.key === 'Enter' && el.dataset.b != null) { e.preventDefault(); primary(); }
    return;
  }
  if (el.closest && el.closest('.t-panel')) return;
  const it = cur();
  const k = e.key.toLowerCase();
  if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  else if (e.key === 'Enter' && (tag === 'BODY' || el.id === 'qcard')) { e.preventDefault(); primary(); }
  else if (it.kind === 'tf' && (k === 't' || k === 'f')) choose(k === 't');
  else if (it.kind === 'mc') {
    let n = '1234'.indexOf(e.key);
    if (n < 0) n = 'abcd'.indexOf(k);
    if (n >= 0 && n < it.opts.length) choose(n);
  }
});

/* ---------- timer ---------- */
const T = { mode: 'up', min: 50, acc: 0, t0: 0, run: false, fired: false };
const tFace = document.getElementById('tFace'), tPlay = document.getElementById('tPlay'), tTime = document.getElementById('tTime');
const tPanel = document.getElementById('tPanel'), tBig = document.getElementById('tBig'), tStart = document.getElementById('tStart');
const tMin = document.getElementById('tMin'), tMinRow = document.getElementById('tMinRow'), timerEl = document.getElementById('timer');
const ICON_PLAY = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="4.5" width="4.2" height="15" rx="1" fill="currentColor"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1" fill="currentColor"/></svg>';
const tElapsed = () => T.acc + (T.run ? Date.now() - T.t0 : 0);
const timerUsed = () => T.run || T.acc > 0;
function fmtTime(ms) {
  const s = T.mode === 'down' ? Math.ceil(ms / 1000) : Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(sec)}` : `${p(m)}:${p(sec)}`;
}
function tToggle() {
  if (T.run) { T.acc = tElapsed(); T.run = false; }
  else {
    if (T.mode === 'down' && tElapsed() >= T.min * 60000) { T.acc = 0; T.fired = false; }
    T.t0 = Date.now(); T.run = true;
  }
  tPaint();
}
function tReset() { T.acc = 0; T.run = false; T.fired = false; tPaint(); }
function tPaint() {
  const el = tElapsed();
  let shown = el, expired = false;
  if (T.mode === 'down') {
    const left = T.min * 60000 - el;
    shown = Math.max(0, left);
    if (left <= 0 && timerUsed()) {
      expired = true;
      if (T.run) { T.acc = T.min * 60000; T.run = false; }
      if (!T.fired) { T.fired = true; toast('Time is up. The countdown has finished.'); }
    }
  }
  const idle = !timerUsed();
  tTime.textContent = idle ? (T.mode === 'down' ? fmtTime(T.min * 60000) : 'Timer') : fmtTime(shown);
  tBig.textContent = fmtTime(idle && T.mode === 'down' ? T.min * 60000 : shown);
  timerEl.classList.toggle('running', T.run);
  timerEl.classList.toggle('expired', expired);
  if (tPlay.dataset.state !== String(T.run)) { tPlay.innerHTML = T.run ? ICON_PAUSE : ICON_PLAY; tPlay.dataset.state = String(T.run); }
  tPlay.setAttribute('aria-label', T.run ? 'Pause timer' : (idle ? 'Start timer' : 'Resume timer'));
  tStart.textContent = T.run ? 'Pause' : (idle ? 'Start' : 'Resume');
}
function closePanel() { tPanel.hidden = true; tFace.setAttribute('aria-expanded', 'false'); }
tFace.addEventListener('click', () => { tPanel.hidden = !tPanel.hidden; tFace.setAttribute('aria-expanded', String(!tPanel.hidden)); });
tPlay.addEventListener('click', tToggle);
tStart.addEventListener('click', tToggle);
document.getElementById('tReset').addEventListener('click', tReset);
tPanel.querySelectorAll('[data-tm]').forEach(b => b.addEventListener('click', () => {
  T.mode = b.dataset.tm;
  tPanel.querySelectorAll('[data-tm]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  tMinRow.hidden = T.mode !== 'down';
  tReset();
}));
tMin.addEventListener('change', () => {
  const v = Math.min(300, Math.max(1, parseInt(tMin.value, 10) || 50));
  tMin.value = v; T.min = v;
  if (!T.run) tReset(); else tPaint();
});
document.addEventListener('click', e => {
  if (!tPanel.hidden && !tPanel.contains(e.target) && !timerEl.contains(e.target)) closePanel();
});
setInterval(tPaint, 250);

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
}

/* ---------- theme ---------- */
const themeBtn = document.getElementById('themeBtn');
const ICON_MOON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
const isDark = () => {
  const t = document.documentElement.getAttribute('data-theme');
  return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
};
function paintTheme() {
  const d = isDark();
  themeBtn.innerHTML = d ? ICON_SUN : ICON_MOON;
  themeBtn.setAttribute('aria-label', d ? 'Switch to light theme' : 'Switch to dark theme');
}
themeBtn.addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('fses-theme', next); } catch (err) { /* storage unavailable */ }
  paintTheme();
});
paintTheme();
tPaint();
render();
</script>
</body>
</html>
